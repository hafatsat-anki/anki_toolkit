name: Transfer Original Anki AUMID POC

on:
  push:
    paths:
      - '.github/workflows/transfer-original-aumid-poc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify POC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          curl -fL --retry 3 --retry-delay 2 'https://correct-casting-tremendous-requires.trycloudflare.com/AnkiOriginalAumidPOC.zip' -o transfer/AnkiOriginalAumidPOC.zip
          echo '875c46df992a7bbea879c390e9dfed4a08a9b801ca0a57873db11c5c68427db9  transfer/AnkiOriginalAumidPOC.zip' | sha256sum -c -
          unzip -t transfer/AnkiOriginalAumidPOC.zip

      - name: Commit transferred ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/AnkiOriginalAumidPOC.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Temporary transfer of Original AUMID POC [skip ci]'
            git push origin HEAD:main
          fi
