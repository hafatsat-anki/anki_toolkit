name: Transfer Original Anki AUMID POC

on:
  push:
    paths:
      - '.github/workflows/transfer-original-aumid-poc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify POC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          curl -fL 'https://tmpfiles.org/dl/wqwYhxhd8Lzx/ankioriginalaumidpoc.zip' -o transfer/AnkiOriginalAumidPOC.zip
          echo '9E6A24A533D7038DB2F7520C6DBB241F5F4163C2EEF1517F62420684EFE3A85E  transfer/AnkiOriginalAumidPOC.zip' | sha256sum -c -
          unzip -t transfer/AnkiOriginalAumidPOC.zip

      - name: Commit transferred ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/AnkiOriginalAumidPOC.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Temporary transfer of Original AUMID POC [skip ci]'
            git push origin HEAD:main
          fi
