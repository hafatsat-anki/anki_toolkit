name: Export Original Anki AUMID POC

on:
  push:
    paths:
      - '.github/workflows/transfer-original-aumid-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed POC
        shell: bash
        run: |
          set -euo pipefail
          FILE='transfer/AnkiOriginalAumidPOC.zip'
          echo '875c46df992a7bbea879c390e9dfed4a08a9b801ca0a57873db11c5c68427db9  transfer/AnkiOriginalAumidPOC.zip' | sha256sum -c -
          unzip -t "$FILE"

      - name: Upload POC artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiOriginalAumidPOC
          path: transfer/AnkiOriginalAumidPOC.zip
          retention-days: 1
