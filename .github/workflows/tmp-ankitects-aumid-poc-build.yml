name: Temporary Ankitects.Anki POC Build

on:
  push:
    branches:
      - tmp/ankitects-aumid-poc-build
    paths:
      - .github/workflows/tmp-ankitects-aumid-poc-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/ankitects-aumid-poc-build

      - name: Materialize exact source
        shell: pwsh
        run: |
          $src = @'

'@
          [IO.File]::WriteAllBytes('source.zip',[Convert]::FromBase64String(($src -replace '\s','')))
          Expand-Archive source.zip -DestinationPath . -Force
          Select-String -Path 'anki-taskbar-poc\main.cpp' -Pattern 'Ankitects.Anki' | Out-Host
          if ((Get-Content 'anki-taskbar-poc\main.cpp' -Raw) -notmatch 'Ankitects\.Anki') { throw 'Patched AUMID missing.' }
          if ((Get-Content 'anki-taskbar-poc\main.cpp' -Raw) -match 'Anki\.ZikaronHaLimud\.Desktop') { throw 'Old AUMID still present.' }

      - name: Configure
        shell: pwsh
        run: cmake -S anki-taskbar-poc -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --verbose

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item build\Release\AnkiTaskbarPinPOC.exe output\AnkiAnkitectsAumidPOC.exe
          Copy-Item build\pttb.exe output\pttb.exe
          Copy-Item anki-taskbar-poc\README.txt output\README.txt
          foreach ($p in @('output\AnkiAnkitectsAumidPOC.exe','output\pttb.exe')) {
            $b=[IO.File]::ReadAllBytes($p)
            if ($b.Length -lt 2 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "$p is not PE" }
          }
          Get-FileHash output\AnkiAnkitectsAumidPOC.exe,output\pttb.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content output\SHA256.txt
          Compress-Archive -Path output\AnkiAnkitectsAumidPOC.exe,output\pttb.exe,output\README.txt,output\SHA256.txt -DestinationPath output\AnkiAnkitectsAumidPOC.zip -Force
          Get-Content output\SHA256.txt

      - name: Publish result to branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output/AnkiAnkitectsAumidPOC.exe output/pttb.exe output/README.txt output/SHA256.txt output/AnkiAnkitectsAumidPOC.zip
          if (!(git diff --cached --quiet)) {
            git commit -m 'Build Ankitects.Anki POC [skip ci]'
            git push origin HEAD:tmp/ankitects-aumid-poc-build
          }
