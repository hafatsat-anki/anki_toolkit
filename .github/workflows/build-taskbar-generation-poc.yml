name: Build Taskbar Generation POC

on:
  push:
    branches:
      - poc/taskbar-generations-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: poc/taskbar-generations-build

      - name: Materialize source
        shell: pwsh
        run: |
          $b64 = @'

'@
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String(($b64 -replace '\s','')))
          Expand-Archive -Path source.zip -DestinationPath . -Force

      - name: Download SysPin-style helper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/0x546F6D/pttb_-_Pin_To_TaskBar/main/pttb.exe' -OutFile 'pttb.exe'

      - name: Configure
        shell: pwsh
        run: cmake -S taskbar-generation-poc-src -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --verbose

      - name: Package and verify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'build\Release\AnkiTaskbarGenerationPOC.exe' 'dist\AnkiTaskbarGenerationPOC.exe' -Force
          Copy-Item 'pttb.exe' 'dist\pttb.exe' -Force
          Copy-Item 'taskbar-generation-poc-src\README.txt' 'dist\README.txt' -Force
          foreach ($p in @('dist\AnkiTaskbarGenerationPOC.exe','dist\pttb.exe')) {
            $bytes = [IO.File]::ReadAllBytes($p)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$p is not PE/MZ" }
          }
          Get-FileHash 'dist\AnkiTaskbarGenerationPOC.exe','dist\pttb.exe' -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content 'dist\SHA256.txt'
          Compress-Archive -Path 'dist\AnkiTaskbarGenerationPOC.exe','dist\pttb.exe','dist\README.txt','dist\SHA256.txt' -DestinationPath 'dist\AnkiTaskbarGenerationPOC.zip' -Force
          Get-Content 'dist\SHA256.txt'

      - name: Publish compiled files
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'dist/AnkiTaskbarGenerationPOC.exe' 'dist/pttb.exe' 'dist/README.txt' 'dist/SHA256.txt' 'dist/AnkiTaskbarGenerationPOC.zip'
          if (!(git diff --cached --quiet)) {
            git commit -m 'Build taskbar generation POC [skip ci]'
            git push origin HEAD:poc/taskbar-generations-build
          }
