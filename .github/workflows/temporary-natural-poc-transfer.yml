name: Temporary Natural POC Transfer
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified POC
        run: |
          set -euo pipefail
          curl -fL 'https://tmpfiles.org/dl/wmwnhBPgH0YT/ankinaturalidentitypoc.zip' -o AnkiNaturalIdentityPOC.zip
          echo '5D74EEAC82AE5398194BCB1D3BB523A917753353FB68E800574871FF902F2A02  AnkiNaturalIdentityPOC.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiNaturalIdentityPOC
          path: AnkiNaturalIdentityPOC.zip
          retention-days: 1
