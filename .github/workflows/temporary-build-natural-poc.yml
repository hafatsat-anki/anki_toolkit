name: Temporary Build Natural POC
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          cmake -S temp-natural-poc -B temp-natural-build -A x64
          cmake --build temp-natural-build --config Release --verbose
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item 'temp-natural-build/Release/AnkiNaturalIdentityPOC.exe' 'out/AnkiNaturalIdentityPOC.exe'
          Copy-Item 'temp-natural-poc/README.txt' 'out/README.txt'
          Get-FileHash 'out/AnkiNaturalIdentityPOC.exe' -Algorithm SHA256 | Format-List | Out-String | Set-Content 'out/SHA256.txt'
          Compress-Archive -Path 'out/AnkiNaturalIdentityPOC.exe','out/README.txt','out/SHA256.txt' -DestinationPath 'AnkiNaturalIdentityPOC.zip' -Force
          Get-FileHash 'AnkiNaturalIdentityPOC.zip' -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiNaturalIdentityPOC
          path: AnkiNaturalIdentityPOC.zip
          retention-days: 1
